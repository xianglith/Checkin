<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CHECKIN เจ้าหน้าที่โรงงาน</title>
  
  <script>
    const webAppUrl = "https://script.google.com/macros/s/AKfycby98w0je9Vl0NBLdkad1PbCcnAxJ9Mpl0-aVaZOmo-_h6zLZG9OqFyuscaLjIoat4L2/exec";

    // ตรวจสอบว่าเป็น iOS (iPhone/iPad) หรือไม่ -> ถ้าใช่ให้ Redirect ทันที
    const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || 
                  (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

    if (isIOS) {
      window.location.href = webAppUrl;
    }
  </script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #f8f9fa;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>

  <!-- ✅ เพิ่ม allow="geolocation" เพื่ออนุญาตให้ดึงพิกัด GPS ผ่าน iframe ได้ -->
  <iframe src="https://script.google.com/macros/s/AKfycby98w0je9Vl0NBLdkad1PbCcnAxJ9Mpl0-aVaZOmo-_h6zLZG9OqFyuscaLjIoat4L2/exec" allow="geolocation"></iframe>

</body>
</html>
